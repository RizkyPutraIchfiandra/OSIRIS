name: CI

# Every pull request and every push to master is type-checked and tested
# before it can reach the Docker image, and the shipped dependencies are
# checked against known advisories.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Docker image runs Node 22, so the checks do too.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      # The repository has 1,600+ pre-existing problems in the upstream
      # dashboard, so a repo-wide lint gate would fail on every PR and be
      # switched off within a week. The NusaWatch surface is clean and is
      # gated here; widening the gate is tracked separately.
      - name: Lint the NusaWatch surface
        run: >
          npx eslint
          src/app/watch
          src/app/api/nusawatch
          src/components/nusawatch
          src/lib/nusawatch
          src/middleware.ts
          src/middleware.test.ts

      - name: Build
        run: npm run build
        env:
          NUSAWATCH_FENCE: "1"

      # Production dependencies only: the dev tool chain (vitest, eslint)
      # never ships in the image.
      - name: Dependency advisories
        run: npm audit --omit=dev --audit-level=high
